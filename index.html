<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>類人猿タイプ診断（12問版）</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Fonts Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-6 text-center">
      <h1 class="text-2xl md:text-3xl font-bold tracking-wide flex items-center justify-center gap-2">
        <i class="fa-solid font-award fa-paw"></i> 類人猿タイプ診断
      </h1>
      <p class="text-emerald-100 text-sm mt-1">12の質問であなたの行動特性とチームでの役割を分析します</p>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-8">

    <!-- スタート画面 -->
    <div id="start-screen" class="bg-white rounded-2xl shadow-lg p-6 md:p-10 text-center border border-slate-100">
      <div class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-inner">
        <i class="fa-solid fa-users"></i>
      </div>
      <h2 class="text-xl md:text-2xl font-bold mb-4 text-slate-800">あなたの「類人猿タイプ」を発見しましょう</h2>
      <p class="text-slate-600 text-sm md:text-base mb-8 leading-relaxed text-left md:text-center">
        人は思考や行動のパターンによって、**チンパンジー・ボノボ・ゴリラ・オランウータン**の4タイプに分類されます。<br class="hidden md:inline">
        直感で自分に最も当てはまるものを選択してください。
      </p>
      <button id="btn-start" class="w-full md:w-auto px-10 py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0">
        診断を開始する <i class="fa-solid fa-arrow-right ml-2"></i>
      </button>
    </div>

    <!-- 診断質問画面 -->
    <div id="quiz-screen" class="hidden">
      <!-- 進捗バー -->
      <div class="bg-white rounded-xl shadow-sm p-4 mb-6 border border-slate-100">
        <div class="flex justify-between items-center text-xs font-semibold text-slate-500 mb-2">
          <span>進捗状況</span>
          <span id="progress-text" class="text-emerald-600">1 / 12</span>
        </div>
        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300 w-[8.33%]"></div>
        </div>
      </div>

      <!-- 質問カード -->
      <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 border border-slate-100 mb-6">
        <span id="question-category" class="inline-block px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded-full mb-3">
          感情表現
        </span>
        <h3 id="question-text" class="text-lg md:text-xl font-bold text-slate-800 mb-6 leading-snug">
          質問文がここに入ります
        </h3>

        <!-- 選択肢 -->
        <div id="options-container" class="space-y-3">
          <!-- JSで動的に追加されます -->
        </div>
      </div>

      <!-- ナビゲーションボタン -->
      <div class="flex justify-between items-center">
        <button id="btn-prev" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-sm transition-colors duration-200 disabled:opacity-40 disabled:cursor-not-allowed">
          <i class="fa-solid fa-chevron-left mr-1"></i> 前へ
        </button>
        <button id="btn-next" disabled class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-sm transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed shadow">
          次へ <i class="fa-solid fa-chevron-right ml-1"></i>
        </button>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden">
      <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 mb-6">
        <!-- タイプヘッダー -->
        <div id="result-header" class="p-8 text-center text-white bg-emerald-600">
          <p class="text-emerald-100 text-xs font-bold uppercase tracking-widest mb-1">Your Diagnosis Result</p>
          <h2 id="result-type-name" class="text-3xl md:text-4xl font-extrabold mb-2">―</h2>
          <p id="result-catchphrase" class="text-emerald-100 text-sm md:text-base font-medium">―</p>
        </div>

        <div class="p-6 md:p-8 space-y-8">
          <!-- タイプ解説 -->
          <div>
            <h4 class="text-base font-bold text-slate-800 border-l-4 border-emerald-500 pl-3 mb-3">タイプの特徴</h4>
            <p id="result-description" class="text-slate-600 text-sm md:text-base leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100">
              ―
            </p>
          </div>

          <!-- スコア内訳 -->
          <div>
            <h4 class="text-base font-bold text-slate-800 border-l-4 border-emerald-500 pl-3 mb-4">4タイプの構成比率</h4>
            <div id="score-breakdown" class="space-y-3">
              <!-- JSで動的に追加されます -->
            </div>
          </div>

          <!-- 軸の分析 -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200/60">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">感情表現の軸</span>
              <p id="axis-e-i" class="font-bold text-slate-700">―</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200/60">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">欲求指向の軸</span>
              <p id="axis-a-g" class="font-bold text-slate-700">―</p>
            </div>
          </div>
        </div>
      </div>

      <!-- アクションボタン -->
      <div class="text-center">
        <button id="btn-restart" class="px-8 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-md transition-all duration-200">
          <i class="fa-solid fa-rotate-right mr-2"></i> もう一度診断する
        </button>
      </div>
    </div>

  </main>

  <!-- フッター -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    &copy; 類人猿タイプ診断 App
  </footer>

  <!-- スクリプト -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // API 設定 (FastAPI等)
      const API_URL = 'http://127.0.0.1:8000/api/ape-profiles';

      // 質問データ（12問）
      const questions = [
        // 感情表現軸 (E: 表に出す / I: 表に出さない)
        { id: 1, category: '感情表現', axis: 'EI', text: '自分の感情や考えていることが、周りの人に伝わりやすいと思う。', optionE: 'とてもそう思う', optionI: 'そう思わない' },
        { id: 2, category: '感情表現', axis: 'EI', text: '会話の最中、ジェスチャーや表情が豊かになることが多い。', optionE: 'あてはまる', optionI: 'あてはまらない' },
        { id: 3, category: '感情表現', axis: 'EI', text: '何か問題が起きたとき、すぐに意見や感情を口に出す方だ。', optionE: 'あてはまる', optionI: 'あてはまらない' },
        { id: 4, category: '感情表現', axis: 'EI', text: '嬉しいことや嫌なことがあった時、顔に出やすいと言われる。', optionE: 'そう思う', optionI: 'そう思わない' },
        { id: 5, category: '感情表現', axis: 'EI', text: '大勢の人の前で自分の意見を発表することにあまり抵抗がない。', optionE: 'あてはまる', optionI: 'あてはまらない' },
        { id: 6, category: '感情表現', axis: 'EI', text: '自分の気持ちを心の中に留めておき、静かに思考を整理することが多い。', optionE: 'そう思わない', optionI: 'とてもそう思う' },

        // 欲求指向軸 (A: 成果・勝ち負け指向 / G: 安定・共感・プロセス指向)
        { id: 7, category: '欲求指向', axis: 'AG', text: '仕事や勝負事において、結果や勝ち負けを重視する。', optionA: 'とてもあてはまる', optionG: 'あてはまらない' },
        { id: 8, category: '欲求指向', axis: 'AG', text: '明確な目標を設定し、それを達成することに最大のやりがいを感じる。', optionA: 'あてはまる', optionG: 'あてはまらない' },
        { id: 9, category: '欲求指向', axis: 'AG', text: '目標達成のためなら、多少のリスクや変化をとることを恐れない。', optionA: 'そう思う', optionG: 'そう思わない' },
        { id: 10, category: '欲求指向', axis: 'AG', text: '勝負で一番になることよりも、みんなで協力して平和に進めることが大切だ。', optionA: 'そう思わない', optionG: 'とてもそう思う' },
        { id: 11, category: '欲求指向', axis: 'AG', text: '人間関係の調和や、お互いの共感・感情を大切にしたい。', optionA: 'あてはまらない', optionG: 'あてはまる' },
        { id: 12, category: '欲求指向', axis: 'AG', text: '急な変化よりも、決められたルールや手順通りに安心して進めたい。', optionA: 'そう思わない', optionG: 'そう思う' }
      ];

      // タイプ定義マスタ
      const typeMaster = {
        CHIMPANZEE: {
          name: 'チンパンジー型',
          catchphrase: '勝ち気に挑む情熱のチャレンジャー',
          description: '感情表現が豊かで、成果や勝ち負けにこだわるエネルギッシュなタイプ。高い目標に向かってチームを牽引する力がありますが、時に積極的すぎる面も。',
          color: 'bg-red-500'
        },
        BONOBO: {
          name: 'ボノボ型',
          catchphrase: '共感と調和を愛するムードメーカー',
          description: '感情表現が豊かで、みんなとの共感や人間関係の調和を最も重視するタイプ。雰囲気を明るくし、チームの連帯感を高めるのが得意です。',
          color: 'bg-pink-500'
        },
        GORILLA: {
          name: 'ゴリラ型',
          catchphrase: '安心と平和を守る頼れる守護者',
          description: '感情を表に強く出さず、秩序や平和、確実なプロセスを重視するタイプ。安定感があり、周囲に安心感を与える信頼できる存在です。',
          color: 'bg-amber-600'
        },
        ORANGUTAN: {
          name: 'オランウータン型',
          catchphrase: '独自の世界で真理を探求するスペシャリスト',
          description: '感情をあまり表に出さず、自分のペースや納得感を大切にしながら成果や課題解決に向き合うタイプ。論理的で職人的な深い思考力を持ちます。',
          color: 'bg-blue-600'
        }
      };

      // 状態管理
      let currentIndex = 0;
      const userAnswers = new Array(questions.length).fill(null);

      // DOM要素
      const startScreen = document.getElementById('start-screen');
      const quizScreen = document.getElementById('quiz-screen');
      const resultScreen = document.getElementById('result-screen');

      const btnStart = document.getElementById('btn-start');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnRestart = document.getElementById('btn-restart');

      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const questionCategory = document.getElementById('question-category');
      const questionText = document.getElementById('question-text');
      const optionsContainer = document.getElementById('options-container');

      // イベントリスナーの設定
      btnStart.addEventListener('click', startQuiz);
      btnPrev.addEventListener('click', goToPrevQuestion);
      btnNext.addEventListener('click', goToNextQuestion);
      btnRestart.addEventListener('click', restartQuiz);

      // 診断開始
      function startQuiz() {
        startScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        currentIndex = 0;
        userAnswers.fill(null);
        renderQuestion();
      }

      // 質問の描画
      function renderQuestion() {
        const q = questions[currentIndex];
        
        // 進捗更新
        const progressPercent = ((currentIndex + 1) / questions.length) * 100;
        progressBar.style.width = `${progressPercent}%`;
        progressText.textContent = `${currentIndex + 1} / ${questions.length}`;

        // テキスト更新
        questionCategory.textContent = q.category;
        questionText.textContent = `Q${currentIndex + 1}. ${q.text}`;

        // 選択肢の構築
        optionsContainer.innerHTML = '';

        const isAxisEI = q.axis === 'EI';
        const labelA = isAxisEI ? q.optionE : q.optionA;
        const labelB = isAxisEI ? q.optionI : q.optionG;
        const valueA = isAxisEI ? 'E' : 'A';
        const valueB = isAxisEI ? 'I' : 'G';

        const options = [
          { label: labelA, value: valueA },
          { label: labelB, value: valueB }
        ];

        options.forEach((opt, idx) => {
          const isSelected = userAnswers[currentIndex] === opt.value;
          const optionEl = document.createElement('label');
          optionEl.className = `flex items-center justify-between p-4 rounded-xl border-2 cursor-pointer transition-all duration-200 ${
            isSelected 
              ? 'border-emerald-500 bg-emerald-50/50 text-emerald-900 font-semibold shadow-sm' 
              : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700'
          }`;

          optionEl.innerHTML = `
            <span class="text-sm md:text-base">${opt.label}</span>
            <input type="radio" name="option" value="${opt.value}" ${isSelected ? 'checked' : ''} class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
          `;

          optionEl.addEventListener('click', () => {
            userAnswers[currentIndex] = opt.value;
            renderQuestion(); // 再描画して選択状態を反映
          });

          optionsContainer.appendChild(optionEl);
        });

        // ボタン制御
        btnPrev.disabled = currentIndex === 0;
        btnNext.disabled = userAnswers[currentIndex] === null;

        if (currentIndex === questions.length - 1) {
          btnNext.innerHTML = '結果を見る <i class="fa-solid fa-square-poll-vertical ml-1"></i>';
        } else {
          btnNext.innerHTML = '次へ <i class="fa-solid fa-chevron-right ml-1"></i>';
        }
      }

      function goToPrevQuestion() {
        if (currentIndex > 0) {
          currentIndex--;
          renderQuestion();
        }
      }

      function goToNextQuestion() {
        if (userAnswers[currentIndex] === null) return;

        if (currentIndex < questions.length - 1) {
          currentIndex++;
          renderQuestion();
        } else {
          showResults();
        }
      }

      // スコア計算ロジック
      function calculateScores() {
        let scoreE = 0, scoreI = 0;
        let scoreA = 0, scoreG = 0;

        userAnswers.forEach(ans => {
          if (ans === 'E') scoreE++;
          if (ans === 'I') scoreI++;
          if (ans === 'A') scoreA++;
          if (ans === 'G') scoreG++;
        });

        // 各タイプヘの重み付けプロファイル計算
        // E × A => チンパンジー
        // E × G => ボノボ
        // I × G => ゴリラ
        // I × A => オランウータン
        const chimpanzeeScore = scoreE + scoreA;
        const bonoboScore = scoreE + scoreG;
        const gorillaScore = scoreI + scoreG;
        const orangutanScore = scoreI + scoreA;

        const totalPoints = chimpanzeeScore + bonoboScore + gorillaScore + orangutanScore;

        const profiles = {
          CHIMPANZEE: Math.round((chimpanzeeScore / totalPoints) * 100),
          BONOBO: Math.round((bonoboScore / totalPoints) * 100),
          GORILLA: Math.round((gorillaScore / totalPoints) * 100),
          ORANGUTAN: Math.round((orangutanScore / totalPoints) * 100)
        };

        // 判定ルール (メジャータイプ決定)
        const isE = scoreE >= scoreI;
        const isA = scoreA >= scoreG;

        let primaryType = '';
        if (isE && isA) primaryType = 'CHIMPANZEE';
        else if (isE && !isA) primaryType = 'BONOBO';
        else if (!isE && !isA) primaryType = 'GORILLA';
        else primaryType = 'ORANGUTAN';

        return {
          primaryType,
          scoreE, scoreI,
          scoreA, scoreG,
          profiles
        };
      }

      // 結果表示
      async function showResults() {
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');

        const result = calculateScores();
        const mainTypeInfo = typeMaster[result.primaryType];

        // 画面の反映
        document.getElementById('result-type-name').textContent = mainTypeInfo.name;
        document.getElementById('result-catchphrase').textContent = mainTypeInfo.catchphrase;
        document.getElementById('result-description').textContent = mainTypeInfo.description;

        document.getElementById('axis-e-i').textContent = 
          result.scoreE > result.scoreI ? `感情表現型 (E: ${result.scoreE}pt)` : `感情抑制型 (I: ${result.scoreI}pt)`;

        document.getElementById('axis-a-g').textContent = 
          result.scoreA > result.scoreG ? `成果指向型 (A: ${result.scoreA}pt)` : `安寧・調和型 (G: ${result.scoreG}pt)`;

        // スコアプログレスバー群のレンダリング
        const breakdownContainer = document.getElementById('score-breakdown');
        breakdownContainer.innerHTML = '';

        Object.keys(typeMaster).forEach(key => {
          const type = typeMaster[key];
          const percentage = result.profiles[key] || 0;

          const row = document.createElement('div');
          row.className = 'space-y-1';
          row.innerHTML = `
            <div class="flex justify-between text-xs font-bold text-slate-600">
              <span>${type.name}</span>
              <span>${percentage}%</span>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div class="${type.color} h-2 rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
            </div>
          `;
          breakdownContainer.appendChild(row);
        });

        // バックエンド保存処理呼び出し
        await saveResultToPythonBackend(result);
      }

      // API送信関数
      async function saveResultToPythonBackend(result) {
        try {
          const payload = {
            primary_type: result.primaryType,
            scores: {
              E: result.scoreE,
              I: result.scoreI,
              A: result.scoreA,
              G: result.scoreG
            },
            profiles: result.profiles,
            timestamp: new Date().toISOString()
          };

          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          console.log('診断結果が正常にPythonサーバーへ送信されました');
        } catch (error) {
          // サーバーが未起動の場合でも画面表示を止めないよう警告ログのみに留める
          console.warn('APIへの保存に失敗しました（サーバー状態を確認してください）:', error.message);
        }
      }

      // リセット
      function restartQuiz() {
        resultScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
