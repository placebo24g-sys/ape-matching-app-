<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>類人猿マッチング 管理画面</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

  <!-- ログインモーダル -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800">管理者ログイン</h2>
        <p class="text-xs text-slate-500 mt-1">ダッシュボードを閲覧するにはパスワードが必要です</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">パスワード</label>
          <input type="password" id="admin-pass-input" required placeholder="管理者パスワードを入力" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 text-sm outline-none">
          <p id="login-error" class="text-xs text-red-500 mt-1 hidden">パスワードが正しくありません</p>
        </div>
        <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition">
          ログインする
        </button>
      </form>
    </div>
  </div>

  <!-- 店舗・コース情報割当モーダル -->
  <div id="venue-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-slate-100">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-store text-indigo-600"></i> 店舗・コース予約情報の割り当て
        </h3>
        <button id="btn-close-venue" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <form id="venue-form" class="space-y-4 text-xs">
        <input type="hidden" id="modal-group-id">
        <div>
          <label class="block font-bold text-slate-700 mb-1">店舗名 / 店頭情報 <span class="text-rose-500">*</span></label>
          <input type="text" id="venue-name" required placeholder="例: 焼肉 叙々苑 渋谷店" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">コース / コース内容・プラン <span class="text-rose-500">*</span></label>
          <input type="text" id="venue-course" required placeholder="例: プレミアム飲み放題付きコース (¥6,000)" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">確定予約日時 <span class="text-rose-500">*</span></label>
          <input type="datetime-local" id="venue-datetime" required class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">店舗メモ・予約番号など（任意）</label>
          <textarea id="venue-notes" placeholder="例: 予約名義：山田 / 3階個室101号" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none h-20"></textarea>
        </div>
        <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
          <button type="button" id="btn-cancel-venue" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition">キャンセル</button>
          <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition">保存して確定</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 手動グループ割り当てモーダル -->
  <div id="manual-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 border border-slate-100 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center pb-4 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-teal-600"></i> 手動グループ割り当て
        </h3>
        <button id="btn-close-manual" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      
      <p class="text-xs text-slate-500 my-3"><i class="fa-solid fa-credit-card text-emerald-600 mr-1"></i> Stripe決済完了済みの待機ユーザーのみ表示されています</p>

      <!-- 待機中ユーザーリスト -->
      <div class="overflow-y-auto flex-1 my-2 border border-slate-200 rounded-xl divide-y divide-slate-100" id="manual-user-list"></div>

      <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
        <button id="btn-cancel-manual" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-bold rounded-xl transition">キャンセル</button>
        <button id="btn-submit-manual" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white text-sm font-bold rounded-xl transition shadow">選択したユーザーでグループ作成</button>
      </div>
    </div>
  </div>

  <!-- 管理画面メインコンテンツ -->
  <div id="admin-content" class="max-w-6xl mx-auto hidden">
    <!-- ヘッダー -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2 text-slate-800">
          <i class="fa-solid fa-gauge-high text-emerald-600"></i> 類人猿マッチング 管理パネル
        </h1>
        <p class="text-xs text-slate-500 mt-1">Stripe決済者マッチング・店舗手配・ブラックリスト管理</p>
      </div>
      
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5">
          <label for="match-mode-select" class="text-xs font-bold text-slate-600 mr-2 whitespace-nowrap">
            <i class="fa-solid fa-sliders text-slate-400 mr-1"></i>モード:
          </label>
          <select id="match-mode-select" class="bg-transparent text-xs font-bold text-slate-800 outline-none cursor-pointer">
            <option value="BALANCE">バランス重視 (4タイプ分散)</option>
            <option value="SAME_TYPE">同タイプ重視 (同じタイプ同士)</option>
          </select>
        </div>

        <button id="btn-run-match" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl transition shadow flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles"></i> 自動マッチング実行
        </button>
        <button id="btn-manual-match" class="px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-sm font-bold rounded-xl transition shadow flex items-center gap-2">
          <i class="fa-solid fa-user-plus"></i> 手動割当
        </button>
        <button id="btn-refresh" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl transition shadow flex items-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> 更新
        </button>
        <button id="btn-logout" class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-bold rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> ログアウト
        </button>
      </div>
    </header>

    <!-- タブ切り替え -->
    <div class="flex border-b border-slate-200 mb-6 gap-2">
      <button id="tab-btn-bookings" class="px-5 py-3 font-bold text-sm rounded-t-xl bg-white text-emerald-600 border-t-2 border-emerald-600 shadow-sm">
        <i class="fa-solid fa-list-check mr-1"></i> 予約申込・決済一覧
      </button>
      <button id="tab-btn-groups" class="px-5 py-3 font-bold text-sm rounded-t-xl bg-slate-200 text-slate-600 hover:bg-slate-300 transition">
        <i class="fa-solid fa-utensils mr-1"></i> マッチング成立・店舗割当管理
      </button>
      <button id="tab-btn-blacklist" class="px-5 py-3 font-bold text-sm rounded-t-xl bg-slate-200 text-slate-600 hover:bg-slate-300 transition">
        <i class="fa-solid fa-user-slash mr-1 text-red-500"></i> ブラックリスト管理
      </button>
    </div>

    <!-- 1. 予約申し込み一覧タブ -->
    <div id="tab-content-bookings" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[800px]">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
              <th class="p-4">決済ステータス</th>
              <th class="p-4">ユーザー情報</th>
              <th class="p-4">【第1希望】エリア / 日時</th>
              <th class="p-4">【第2希望】エリア / 日時</th>
              <th class="p-4">診断タイプ</th>
              <th class="p-4">グループID</th>
              <th class="p-4">申込日時</th>
            </tr>
          </thead>
          <tbody id="bookings-tbody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-400">データを読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 2. マッチング成立グループタブ -->
    <div id="tab-content-groups" class="hidden space-y-4">
      <div id="groups-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- JSでグループカードが挿入されます -->
      </div>
    </div>

    <!-- 3. ブラックリスト管理タブ -->
    <div id="tab-content-blacklist" class="hidden space-y-6">
      <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-emerald-600"></i> ブラックリスト手動追加
        </h2>
        <form id="add-blacklist-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">ユーザーID (必須)</label>
            <input type="text" id="bl-user-id" required placeholder="例: usr_abc123" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">登録理由 (任意)</label>
            <input type="text" id="bl-reason" placeholder="例: 無断キャンセル複数回" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div class="flex items-end">
            <button type="submit" id="btn-add-bl" class="w-full py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg text-sm shadow transition">
              <i class="fa-solid fa-ban mr-1"></i> ブラックリストに追加
            </button>
          </div>
        </form>
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-user-slash text-red-600"></i> ブラックリスト登録ユーザー一覧
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold text-xs uppercase">
                <th class="p-3">ユーザーID</th>
                <th class="p-3">登録理由</th>
                <th class="p-3">登録日時</th>
                <th class="p-3 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="blacklist-tbody" class="divide-y divide-slate-100">
              <tr>
                <td colspan="4" class="p-6 text-center text-slate-400">データを読み込み中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = 'https://ape-matching-api.onrender.com/api';

    const loginModal = document.getElementById('login-modal');
    const adminContent = document.getElementById('admin-content');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    let currentBookings = [];

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getSavedPassword() {
      return sessionStorage.getItem('ape_admin_password');
    }

    function handleAuthError() {
      sessionStorage.removeItem('ape_admin_password');
      loginError.innerText = 'パスワードが正しくないか、セッションが切れました。';
      loginError.classList.remove('hidden');
      showLogin();
    }

    // 予約一覧の取得 (Stripe決済状況バッジの表示)
    async function fetchBookings() {
      const password = getSavedPassword();
      if (!password) return showLogin();

      const tbody = document.getElementById('bookings-tbody');
      tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>読み込み中...</td></tr>`;

      try {
        const response = await fetch(`${API_BASE}/bookings`, {
          method: 'GET',
          headers: { 'X-Admin-Password': password }
        });

        if (response.status === 401) return handleAuthError();
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        loginError.classList.add('hidden');
        const bookings = await response.json();
        currentBookings = bookings || [];
        hideLogin();

        if (!bookings || bookings.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">現在、予約データはありません</td></tr>`;
          return;
        }

        tbody.innerHTML = '';
        bookings.forEach(b => {
          // Stripe決済状況の確認 (payment_status: 'paid' を想定)
          const isPaid = b.payment_status === 'paid' || b.is_paid === true;
          
          let paymentBadge = isPaid
            ? `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full inline-flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> 決済完了</span>`
            : `<span class="px-2.5 py-1 bg-rose-100 text-rose-700 text-xs font-bold rounded-full inline-flex items-center gap-1"><i class="fa-solid fa-clock"></i> 未決済</span>`;

          if (b.status === 'matched') {
            paymentBadge += `<div class="mt-1"><span class="px-2 py-0.5 bg-blue-100 text-blue-700 text-[10px] font-bold rounded">マッチ済</span></div>`;
          }

          const genderText = b.gender === 'male' ? '男' : b.gender === 'female' ? '女' : escapeHtml(b.gender || '-');
          const ageText = b.age ? `${escapeHtml(b.age)}歳` : '年齢未指定';
          const primaryType = b.primary_type ? escapeHtml(b.primary_type) : '-';

          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50/80 transition-colors';
          tr.innerHTML = `
            <td class="p-4">${paymentBadge}</td>
            <td class="p-4">
              <div class="font-bold text-slate-800">${escapeHtml(b.name)} <span class="text-xs text-slate-500 font-normal">(${ageText} / ${genderText})</span></div>
              <div class="text-xs font-mono text-slate-400">ID: ${escapeHtml(b.booking_id || b.user_id)}</div>
            </td>
            <td class="p-4">
              <span class="inline-block bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-xs font-bold mb-1">${escapeHtml(b.area)}</span>
              <div class="text-xs font-mono text-slate-600">${b.datetime ? escapeHtml(b.datetime.replace('T', ' ')) : '-'}</div>
            </td>
            <td class="p-4">
              ${b.area_2 ? `
                <span class="inline-block bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-xs font-bold mb-1">${escapeHtml(b.area_2)}</span>
                <div class="text-xs font-mono text-slate-500">${b.datetime_2 ? escapeHtml(b.datetime_2.replace('T', ' ')) : '-'}</div>
              ` : '<span class="text-slate-300 text-xs">なし</span>'}
            </td>
            <td class="p-4"><span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">${primaryType}</span></td>
            <td class="p-4 font-mono text-xs text-purple-600">${escapeHtml(b.group_id || '-')}</td>
            <td class="p-4 text-xs text-slate-400">${escapeHtml(b.created_at || '-')}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500"><i class="fa-solid fa-triangle-exclamation mr-2"></i>データの取得に失敗しました。</td></tr>`;
      }
    }

    // マッチング成立グループ・店舗割り当て一覧の取得
    async function fetchGroups() {
      const password = getSavedPassword();
      if (!password) return showLogin();

      const container = document.getElementById('groups-container');
      container.innerHTML = `<p class="col-span-2 text-center text-slate-400 p-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i>グループデータを読み込み中...</p>`;

      try {
        const response = await fetch(`${API_BASE}/matchings`, {
          method: 'GET',
          headers: { 'X-Admin-Password': password }
        });

        if (response.status === 401) return handleAuthError();
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        const groups = await response.json();
        if (!groups || groups.length === 0) {
          container.innerHTML = `<p class="col-span-2 text-center text-slate-400 p-8">まだ成立したマッチンググループはありません。</p>`;
          return;
        }

        container.innerHTML = '';
        groups.forEach(g => {
          const firstMember = g.members && g.members.length > 0 ? g.members[0] : {};
          const card = document.createElement('div');
          card.className = 'bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between';
          
          let memberListHtml = (g.members || []).map(m => `
            <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
              <div>
                <span class="font-bold text-slate-800">${escapeHtml(m.name)}</span>
                <span class="text-xs text-slate-500 ml-2">(${escapeHtml(m.age ? m.age + '歳' : '')} / ${escapeHtml(m.gender)})</span>
              </div>
              <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">${escapeHtml(m.primary_type || '-')}</span>
            </div>
          `).join('');

          // 店舗予約手配情報の表示領域
          const hasVenue = g.venue_name && g.venue_course;
          const venueHtml = hasVenue ? `
            <div class="mt-4 p-3.5 bg-indigo-50 border border-indigo-100 rounded-xl space-y-1 text-xs">
              <div class="flex justify-between items-center">
                <span class="font-bold text-indigo-900 flex items-center gap-1">
                  <i class="fa-solid fa-store text-indigo-600"></i> ${escapeHtml(g.venue_name)}
                </span>
                <span class="text-[10px] bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded font-bold">予約確定済</span>
              </div>
              <p class="text-indigo-800"><strong>コース:</strong> ${escapeHtml(g.venue_course)}</p>
              <p class="text-indigo-800"><strong>日時:</strong> ${g.venue_datetime ? escapeHtml(g.venue_datetime.replace('T', ' ')) : '-'}</p>
              ${g.venue_notes ? `<p class="text-indigo-600 text-[11px] pt-1 border-t border-indigo-100">メモ: ${escapeHtml(g.venue_notes)}</p>` : ''}
            </div>
          ` : `
            <div class="mt-4 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 flex justify-between items-center">
              <span><i class="fa-solid fa-triangle-exclamation mr-1"></i> 店舗・コース未割り当て</span>
              <button onclick="openVenueModal('${escapeHtml(g.group_id)}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-xs transition">
                店舗を割り当てる
              </button>
            </div>
          `;

          card.innerHTML = `
            <div>
              <div class="flex justify-between items-center mb-3 pb-3 border-b border-slate-100">
                <div>
                  <span class="text-xs font-mono bg-indigo-50 text-indigo-600 px-2 py-1 rounded font-bold">${escapeHtml(g.group_id)}</span>
                  <p class="text-xs text-slate-500 mt-1">
                    <i class="fa-solid fa-location-dot"></i> 希望エリア: ${escapeHtml(firstMember.area || '-')}
                  </p>
                </div>
                <span class="text-xs font-bold bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full">${g.members ? g.members.length : 0}名チーム</span>
              </div>

              <div class="space-y-2 mb-2">
                ${memberListHtml}
              </div>

              ${venueHtml}
            </div>

            <div class="pt-4 mt-4 border-t border-slate-100 flex justify-between items-center">
              ${hasVenue ? `
                <button onclick="openVenueModal('${escapeHtml(g.group_id)}', '${escapeHtml(g.venue_name)}', '${escapeHtml(g.venue_course)}', '${escapeHtml(g.venue_datetime)}', '${escapeHtml(g.venue_notes)}')" class="text-xs text-indigo-600 hover:underline font-bold">
                  <i class="fa-solid fa-pen-to-square"></i> 店舗情報を編集
                </button>
              ` : '<span></span>'}
              <button onclick="cancelGroup('${escapeHtml(g.group_id)}')" class="text-xs text-red-500 hover:text-red-700 font-bold flex items-center gap-1 transition">
                <i class="fa-solid fa-trash-can"></i> 解散・リセット
              </button>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        container.innerHTML = `<p class="col-span-2 text-center text-red-500 p-8"><i class="fa-solid fa-triangle-exclamation mr-2"></i>エラーが発生しました。</p>`;
      }
    }

    // グループの解散
    window.cancelGroup = async function(groupId) {
      if (!confirm(`グループ [ ${groupId} ] を解散・リセットしますか？\nメンバーのマッチングステータスが元に戻ります。`)) return;
      
      const password = getSavedPassword();
      try {
        const response = await fetch(`${API_BASE}/matchings/${groupId}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Password': password }
        });
        if (response.ok) {
          alert('グループを解散しました');
          fetchGroups();
          fetchBookings();
        } else {
          alert('解散処理に失敗しました');
        }
      } catch (e) {
        alert('通信エラーが発生しました');
      }
    };

    // --- 店舗割り当てモーダル処理 ---
    const venueModal = document.getElementById('venue-modal');
    const venueForm = document.getElementById('venue-form');

    window.openVenueModal = function(groupId, name = '', course = '', datetime = '', notes = '') {
      document.getElementById('modal-group-id').value = groupId;
      document.getElementById('venue-name').value = name;
      document.getElementById('venue-course').value = course;
      document.getElementById('venue-datetime').value = datetime;
      document.getElementById('venue-notes').value = notes;
      venueModal.classList.remove('hidden');
    };

    document.getElementById('btn-close-venue').addEventListener('click', () => venueModal.classList.add('hidden'));
    document.getElementById('btn-cancel-venue').addEventListener('click', () => venueModal.classList.add('hidden'));

    venueForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = getSavedPassword();
      const groupId = document.getElementById('modal-group-id').value;
      const venueData = {
        venue_name: document.getElementById('venue-name').value,
        venue_course: document.getElementById('venue-course').value,
        venue_datetime: document.getElementById('venue-datetime').value,
        venue_notes: document.getElementById('venue-notes').value
      };

      try {
        const response = await fetch(`${API_BASE}/matchings/${groupId}/venue`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Password': password
          },
          body: JSON.stringify(venueData)
        });

        if (response.ok) {
          alert('店舗・コース情報を保存しました');
          venueModal.classList.add('hidden');
          fetchGroups();
        } else {
          alert('保存に失敗しました（APIエンドポイントをご確認ください）');
        }
      } catch (err) {
        alert('通信エラーが発生しました');
      }
    });

    // 手動割当モーダル表示 (Stripe決済完了者のみ抽出)
    document.getElementById('btn-manual-match').addEventListener('click', () => {
      const manualUserList = document.getElementById('manual-user-list');
      manualUserList.innerHTML = '';
      
      // 未マッチング かつ Stripe決済完了者 (is_paid === true / payment_status === 'paid') のみ抽出
      const pendingPaidUsers = currentBookings.filter(b => 
        b.status !== 'matched' && (b.payment_status === 'paid' || b.is_paid === true)
      );

      if (pendingPaidUsers.length === 0) {
        manualUserList.innerHTML = '<p class="p-6 text-center text-slate-400 text-sm">現在割り当て可能な決済完了済みの待機ユーザーはいません。</p>';
      } else {
        pendingPaidUsers.forEach(u => {
          const targetId = u.booking_id || u.user_id;
          const genderText = u.gender === 'male' ? '男' : u.gender === 'female' ? '女' : escapeHtml(u.gender || '-');
          const item = document.createElement('label');
          item.className = 'flex items-center justify-between p-3.5 hover:bg-slate-50 cursor-pointer transition select-none';
          item.innerHTML = `
            <div class="flex items-center gap-3">
              <input type="checkbox" value="${escapeHtml(targetId)}" class="manual-user-checkbox w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500">
              <div>
                <div class="font-bold text-slate-800 text-sm">${escapeHtml(u.name)} <span class="text-xs text-slate-500 font-normal">(${escapeHtml(u.age || '-')}歳 / ${genderText})</span></div>
                <div class="text-xs text-slate-500">${escapeHtml(u.area)} | ${u.datetime ? escapeHtml(u.datetime.replace('T', ' ')) : '-'}</div>
              </div>
            </div>
            <span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">${escapeHtml(u.primary_type || '-')}</span>
          `;
          manualUserList.appendChild(item);
        });
      }

      document.getElementById('manual-modal').classList.remove('hidden');
    });

    document.getElementById('btn-close-manual').addEventListener('click', () => document.getElementById('manual-modal').classList.add('hidden'));
    document.getElementById('btn-cancel-manual').addEventListener('click', () => document.getElementById('manual-modal').classList.add('hidden'));

    // 自動マッチング実行
    document.getElementById('btn-run-match').addEventListener('click', async () => {
      const mode = document.getElementById('match-mode-select').value;
      if (!confirm(`モード [ ${mode === 'BALANCE' ? 'バランス重視' : '同タイプ重視'} ] で自動マッチングを実行しますか？`)) return;

      const password = getSavedPassword();
      try {
        const response = await fetch(`${API_BASE}/matchings/auto`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Admin-Password': password 
          },
          body: JSON.stringify({ mode })
        });

        if (response.ok) {
          const resData = await response.json();
          alert(`自動マッチングが完了しました！\n生成グループ数: ${resData.created_count || 0}`);
          fetchBookings();
          fetchGroups();
        } else {
          alert('自動マッチング処理に失敗しました');
        }
      } catch (e) {
        alert('通信エラーが発生しました');
      }
    });

    // ブラックリスト機能
    async function fetchBlacklist() {
      const password = getSavedPassword();
      if (!password) return showLogin();
      const tbody = document.getElementById('blacklist-tbody');
      tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>読み込み中...</td></tr>';
      try {
        const response = await fetch(`${API_BASE}/admin/blacklist`, { headers: { 'X-Admin-Password': password } });
        if (response.status === 401) return handleAuthError();
        const data = await response.json();
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-400">現在ブラックリストユーザーはいません。</td></tr>';
          return;
        }
        tbody.innerHTML = '';
        data.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50 transition-colors';
          tr.innerHTML = `
            <td class="p-3 font-mono font-bold text-slate-700">${escapeHtml(item.user_id)}</td>
            <td class="p-3 text-slate-600">${escapeHtml(item.reason || 'なし')}</td>
            <td class="p-3 text-xs text-slate-400">${item.created_at ? new Date(item.created_at).toLocaleString('ja-JP') : '―'}</td>
            <td class="p-3 text-right">
              <button onclick="removeBlacklist('${escapeHtml(item.user_id)}')" class="px-3 py-1 bg-slate-200 hover:bg-emerald-600 hover:text-white text-slate-700 text-xs font-bold rounded-lg transition">解除</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-red-500 font-bold">ブラックリスト取得失敗</td></tr>';
      }
    }

    document.getElementById('add-blacklist-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = getSavedPassword();
      const userId = document.getElementById('bl-user-id').value.trim();
      const reason = document.getElementById('bl-reason').value.trim();

      try {
        const response = await fetch(`${API_BASE}/admin/blacklist`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
          body: JSON.stringify({ user_id: userId, reason })
        });
        if (response.ok) {
          alert('ブラックリストに追加しました');
          document.getElementById('bl-user-id').value = '';
          document.getElementById('bl-reason').value = '';
          fetchBlacklist();
        } else {
          alert('追加に失敗しました');
        }
      } catch (err) {
        alert('エラーが発生しました');
      }
    });

    window.removeBlacklist = async function(userId) {
      if (!confirm(`ユーザー [ ${userId} ] をブラックリストから解除しますか？`)) return;
      const password = getSavedPassword();
      try {
        const response = await fetch(`${API_BASE}/admin/blacklist/${userId}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Password': password }
        });
        if (response.ok) {
          fetchBlacklist();
        } else {
          alert('解除に失敗しました');
        }
      } catch (err) {
        alert('エラーが発生しました');
      }
    };

    document.getElementById('btn-submit-manual').addEventListener('click', async () => {
      const selectedCheckboxes = document.querySelectorAll('.manual-user-checkbox:checked');
      const selectedIds = Array.from(selectedCheckboxes).map(cb => cb.value);
      if (selectedIds.length < 2) return alert('2名以上のユーザーを選択してください');
      if (!confirm(`選択した ${selectedIds.length} 名でグループを作成しますか？`)) return;

      const password = getSavedPassword();
      try {
        const response = await fetch(`${API_BASE}/matchings/manual`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
          body: JSON.stringify({ booking_ids: selectedIds })
        });
        if (response.ok) {
          alert('手動グループ作成完了');
          document.getElementById('manual-modal').classList.add('hidden');
          fetchBookings();
          fetchGroups();
        } else {
          alert('手動グループ作成に失敗しました');
        }
      } catch (e) {
        alert('エラーが発生しました');
      }
    });

    // タブ制御
    const tabBookings = document.getElementById('tab-btn-bookings');
    const tabGroups = document.getElementById('tab-btn-groups');
    const tabBlacklist = document.getElementById('tab-btn-blacklist');
    const contentBookings = document.getElementById('tab-content-bookings');
    const contentGroups = document.getElementById('tab-content-groups');
    const contentBlacklist = document.getElementById('tab-content-blacklist');

    function resetTabs() {
      const inactive = 'px-5 py-3 font-bold text-sm rounded-t-xl bg-slate-200 text-slate-600 hover:bg-slate-300 transition';
      tabBookings.className = inactive;
      tabGroups.className = inactive;
      tabBlacklist.className = inactive;
      contentBookings.classList.add('hidden');
      contentGroups.classList.add('hidden');
      contentBlacklist.classList.add('hidden');
    }
    const active = 'px-5 py-3 font-bold text-sm rounded-t-xl bg-white text-emerald-600 border-t-2 border-emerald-600 shadow-sm';

    tabBookings.addEventListener('click', () => { resetTabs(); tabBookings.className = active; contentBookings.classList.remove('hidden'); fetchBookings(); });
    tabGroups.addEventListener('click', () => { resetTabs(); tabGroups.className = active; contentGroups.classList.remove('hidden'); fetchGroups(); });
    tabBlacklist.addEventListener('click', () => { resetTabs(); tabBlacklist.className = active; contentBlacklist.classList.remove('hidden'); fetchBlacklist(); });

    function showLogin() { loginModal.classList.remove('hidden'); adminContent.classList.add('hidden'); }
    function hideLogin() { loginModal.classList.add('hidden'); adminContent.classList.remove('hidden'); }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      sessionStorage.setItem('ape_admin_password', document.getElementById('admin-pass-input').value);
      fetchBookings();
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      sessionStorage.removeItem('ape_admin_password');
      showLogin();
    });

    document.getElementById('btn-refresh').addEventListener('click', () => {
      if (!contentBookings.classList.contains('hidden')) fetchBookings();
      else if (!contentGroups.classList.contains('hidden')) fetchGroups();
      else fetchBlacklist();
    });

    // 初期化チェック
    window.addEventListener('DOMContentLoaded', () => {
      if (getSavedPassword()) {
        fetchBookings();
      } else {
        showLogin();
      }
    });
  </script>
</body>
</html>
