<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>類人猿マッチング 管理画面</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto">
    <!-- ヘッダー -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2 text-slate-800">
          <i class="fa-solid fa-gauge-high text-emerald-600"></i> 管理者ダッシュボード
        </h1>
        <p class="text-xs text-slate-500 mt-1">食事会マッチングへの応募・予約者一覧</p>
      </div>
      <button id="btn-refresh" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl transition shadow flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i> データを更新する
      </button>
    </header>

    <!-- 一覧テーブルカード -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
              <th class="p-4">予約ID</th>
              <th class="p-4">お名前</th>
              <th class="p-4">性別</th>
              <th class="p-4">希望エリア</th>
              <th class="p-4">希望日時</th>
              <th class="p-4">診断タイプ</th>
              <th class="p-4">申込日時</th>
            </tr>
          </thead>
          <tbody id="bookings-tbody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-400">データを読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- スクリプト -->
  <script>
    const BOOKING_API_URL = 'https://ape-matching-api.onrender.com/api/bookings';

    async function fetchBookings() {
      const tbody = document.getElementById('bookings-tbody');
      tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">読み込み中...</td></tr>`;

      try {
        const response = await fetch(BOOKING_API_URL);
        if (!response.ok) {
          throw new Error('データの取得に失敗しました');
        }
        const bookings = await response.json();

        if (bookings.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">現在、予約データはありません</td></tr>`;
          return;
        }

        tbody.innerHTML = '';
        bookings.forEach(b => {
          const tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50/80 transition-colors';
          tr.innerHTML = `
            <td class="p-4 font-mono text-xs text-slate-500">${b.booking_id}</td>
            <td class="p-4 font-bold text-slate-800">${b.name}</td>
            <td class="p-4 text-slate-600">${b.gender}</td>
            <td class="p-4 text-slate-600">${b.area}</td>
            <td class="p-4 text-slate-600">${b.datetime ? b.datetime.replace('T', ' ') : '-'}</td>
            <td class="p-4"><span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">${b.primary_type}</span></td>
            <td class="p-4 text-xs text-slate-400">${b.created_at || '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500">データの取得に失敗しました。サーバーが起動中か確認してください。</td></tr>`;
      }
    }

    document.getElementById('btn-refresh').addEventListener('click', fetchBookings);
    document.addEventListener('DOMContentLoaded', fetchBookings);
  </script>
</body>
</html>
